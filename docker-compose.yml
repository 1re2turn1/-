version: '3.8'

services:
  # we-mp-rss服务 - 将微信公众号转换为RSS
  we-mp-rss:
    image: ghcr.io/rachelos/we-mp-rss:latest
    container_name: we-mp-rss
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - wechat-rss-network

  # 本服务 - Webhook RSS处理器
  wechat-rss-webhook:
    build: .
    container_name: wechat-rss-webhook
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - RSS_FEED_URL=http://we-mp-rss:8001/rss/示例公众号
      - POLL_INTERVAL=300
      # - WEBHOOK_TARGET_URL=https://your-webhook-url.com/callback
    restart: unless-stopped
    depends_on:
      - we-mp-rss
    networks:
      - wechat-rss-network

networks:
  wechat-rss-network:
    driver: bridge
